[project]
name = "lastfm-release-tracker"
version = "0.1.0"
description = "Sandbox"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "beautifulsoup4>=4.14.3",
    "mypy>=1.19.1",
    "platformdirs>=4.0.0",
    "psycopg[binary]>=3.3.2",
    "pytest-cov>=7.0.0",
    "pytest>=9.0.2",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "rich-pixels>=3.0.1",
    "ruff>=0.14.14",
    "sqlalchemy>=2.0.46",
    "textual-dev>=1.8.0",
    "textual>=7.4.0",
    "types-requests>=2.32.4.20260107",
]

[project.scripts]
lastfm-rt = "lastfm_release_tracker.app_configuration.main_app:main"
lastfm-releases-tracker = "lastfm_release_tracker.app_configuration.main_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lastfm_release_tracker"]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # pep8-naming
    "N",
]
ignore = [
    "E501",# line length
    "UP046",# Generic subclass vs type parameters
]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402", "SIM117"]
"alembic/*" = ["E402"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
exclude = ["tests/", "alembic/"]
no_implicit_optional = false
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
disable_error_code = ["call-overload", "arg-type", "type-arg", "var-annotated", "union-attr",  "abstract"]
mypy_path = "stubs"

[[tool.mypy.overrides]]
module = ["textual.*", "bs4.*", "dotenv.*", "rich_pixels.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=lastfm_release_tracker.service --cov=lastfm_release_tracker.scrapper --cov=lastfm_release_tracker.model --cov=lastfm_release_tracker.pages --cov=lastfm_release_tracker.utils --cov-report=term-missing --cov-report=html"

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
