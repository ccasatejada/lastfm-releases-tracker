[project]
name = "lastfm-release-tracker"
version = "0.1.0"
description = "Sandbox"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "beautifulsoup4>=4.14.3",
    "mypy>=1.19.1",
    "psycopg[binary]>=3.3.2",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "rich-pixels>=3.0.1",
    "ruff>=0.14.14",
    "sqlalchemy>=2.0.46",
    "textual-dev>=1.8.0",
    "textual-window>=0.7.0",
    "textual>=7.4.0",
]
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # pep8-naming
    "N",
]
ignore = [
    "E501",# line length
]
unfixable = ["B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"**/{tests,docs,tools}/*" = ["E402"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_subclassing_any = false
mypy_path = "stubs"

[[tool.mypy.overrides]]
module = ["textual.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]
